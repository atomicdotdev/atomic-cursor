schema = 1
agent = "cursor"
version = "1.0.0"

[requires]
atomic = ">=0.11.0"

[skills-source]
package = "atomic-skills"

[skills]
install = "all"
dst_pattern = "~/.cursor/skills/{name}/SKILL.md"

[[skill]]
src = "AGENTS.md"
dst = "~/.cursor/rules/atomic.md"

[[repo-file]]
src = "AGENTS.md"
dst = "AGENTS.md"

[[settings]]
manifest = "hooks/cursor.atomic-hooks.json"
